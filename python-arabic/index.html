<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141a22">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
/* ================= Design tokens ================= */
:root{
  --bg:#f5f7f9; --surface:#ffffff; --surface-2:#eff2f5; --surface-3:#e6eaef; --border:#e0e4ea;
  --text:#1a2130; --muted:#5a6475; --faint:#8a93a3;
  --accent:#04AA6D; --accent-hover:#03945e; --accent-ink:#ffffff; --accent-soft:#e4f6ee; --accent-text:#03794d;
  --code-bg:#fbfcfd; --inline-code:#eef1f4;
  --con-bg:#0f141b; --con-head:#171e28; --con-text:#e4eaf1; --con-muted:#8b97a8;
  --tip-bg:#eaf4ff; --tip-bd:#3a86cc; --warn-bg:#fff5e3; --warn-bd:#df9b21; --info-bg:#f1eefe; --info-bd:#7b68d9;
  --err:#d23b3b; --err-soft:rgba(225,70,70,.14); --ok:#04AA6D; --ok-soft:rgba(4,170,109,.16);
  --tok-kw:#a626a4; --tok-str:#2b8a3e; --tok-num:#b55a00; --tok-com:#8a94a3; --tok-def:#2563c9; --tok-builtin:#0d7c8c; --tok-op:#4b5563; --tok-prop:#7a4fbf;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.05);
  --grad-a:#0bc47f; --grad-b:#03784f; --glow:rgba(4,170,109,.28);
  --side-w:300px; --hdr-h:58px; --radius:12px;
  --sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));
  --sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117; --surface:#141a22; --surface-2:#1b222c; --surface-3:#232c38; --border:#28313d;
    --text:#e6ebf1; --muted:#9aa5b5; --faint:#6f7a8a;
    --accent:#04AA6D; --accent-hover:#05bf7a; --accent-ink:#ffffff; --accent-soft:#0f2a20; --accent-text:#45d69a;
    --code-bg:#10161e; --inline-code:#222b36;
    --con-bg:#0a0e13; --con-head:#121820; --con-text:#e4eaf1; --con-muted:#8b97a8;
    --tip-bg:#102236; --tip-bd:#4a9be0; --warn-bg:#2a2010; --warn-bd:#e0a43a; --info-bg:#1c1934; --info-bd:#9887f0;
    --err:#ff7676; --err-soft:rgba(255,100,100,.14); --ok:#2fd08e; --ok-soft:rgba(47,208,142,.15);
    --tok-kw:#d495f5; --tok-str:#8fd694; --tok-num:#f4aa60; --tok-com:#6e7b8d; --tok-def:#7db4ff; --tok-builtin:#5fd0dc; --tok-op:#c3cbd5; --tok-prop:#c4a6ff;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117; --surface:#141a22; --surface-2:#1b222c; --surface-3:#232c38; --border:#28313d;
  --text:#e6ebf1; --muted:#9aa5b5; --faint:#6f7a8a;
  --accent:#04AA6D; --accent-hover:#05bf7a; --accent-ink:#ffffff; --accent-soft:#0f2a20; --accent-text:#45d69a;
  --code-bg:#10161e; --inline-code:#222b36;
  --con-bg:#0a0e13; --con-head:#121820; --con-text:#e4eaf1; --con-muted:#8b97a8;
  --tip-bg:#102236; --tip-bd:#4a9be0; --warn-bg:#2a2010; --warn-bd:#e0a43a; --info-bg:#1c1934; --info-bd:#9887f0;
  --err:#ff7676; --err-soft:rgba(255,100,100,.14); --ok:#2fd08e; --ok-soft:rgba(47,208,142,.15);
  --tok-kw:#d495f5; --tok-str:#8fd694; --tok-num:#f4aa60; --tok-com:#6e7b8d; --tok-def:#7db4ff; --tok-builtin:#5fd0dc; --tok-op:#c3cbd5; --tok-prop:#c4a6ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25);
  color-scheme:dark;
}

/* ================= Base ================= */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:17px;line-height:1.9;-webkit-font-smoothing:antialiased}
a{color:var(--accent-text)}
button{font-family:inherit;cursor:pointer}
code,kbd,pre,.mono{font-family:"JetBrains Mono","IBM Plex Sans Arabic",ui-monospace,Consolas,monospace}
:not(pre)>code{direction:ltr;unicode-bidi:isolate;background:var(--inline-code);padding:1px 6px;border-radius:5px;font-size:.86em;white-space:nowrap}
kbd{direction:ltr;unicode-bidi:isolate;font-size:.8em;background:var(--surface);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ================= Header ================= */
.busy-bar{position:fixed;top:0;inset-inline:0;height:3px;z-index:100;overflow:hidden;opacity:0;transition:opacity .3s}
.busy-bar.on{opacity:1}
.busy-bar::after{content:"";position:absolute;inset-block:0;width:35%;background:var(--accent);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{right:-35%}100%{right:100%}}
.hdr{position:sticky;top:0;z-index:40;height:calc(var(--hdr-h) + var(--sat));display:flex;align-items:center;gap:12px;padding:var(--sat) 16px 0;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:19px;color:var(--text);text-decoration:none;white-space:nowrap}
.brand .logo{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);font-size:19px}
.brand b{color:var(--accent-text);font-weight:700}
.hdr-progress{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.pbar{width:120px;height:7px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .5s ease}
.status{display:flex;align-items:center;gap:7px;font-size:13px;padding:5px 12px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap;max-width:260px}
.status .st-text{overflow:hidden;text-overflow:ellipsis}
.status .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--warn-bd)}
.status[data-state="loading"] .dot{animation:pulse 1s ease-in-out infinite}
.status[data-state="ready"] .dot{background:var(--ok)}
.status[data-state="error"] .dot{background:var(--err)}
.status[data-state="error"]{color:var(--err)}
@keyframes pulse{50%{opacity:.25;transform:scale(.8)}}
.icon-btn{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:18px;line-height:1}
.icon-btn:hover{background:var(--surface-2)}
#menuBtn{display:none}

/* ================= Layout ================= */
.layout{display:flex;align-items:flex-start}
#sidebar{position:sticky;top:calc(var(--hdr-h) + var(--sat));height:calc(100vh - var(--hdr-h) - var(--sat));width:var(--side-w);flex:0 0 var(--side-w);display:flex;flex-direction:column;background:var(--surface);border-inline-end:1px solid var(--border)}
.side-search{padding:12px 12px 8px}
.side-search input{width:100%;height:40px;border:1px solid var(--border);border-radius:10px;padding:0 12px;background:var(--surface-2);color:var(--text);font:inherit;font-size:15px}
.side-search input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
#nav{flex:1;overflow-y:auto;padding:4px 8px 16px;overscroll-behavior:contain}
.side-foot{padding:10px 12px;border-top:1px solid var(--border)}
.side-foot button{width:100%;background:none;border:1px dashed var(--border);color:var(--muted);border-radius:8px;padding:6px;font-size:13px}
.side-foot button:hover{color:var(--err);border-color:var(--err)}
#overlay{display:none}
main{flex:1;min-width:0;padding:28px 32px calc(96px + var(--sab))}
#lesson{max-width:860px;margin-inline:auto}

/* ================= Sidebar nav ================= */
.grp{margin-bottom:4px}
.grp-h{width:100%;display:flex;align-items:center;gap:8px;padding:9px 10px;border:0;border-radius:10px;background:none;color:var(--text);font-size:15.5px;font-weight:700;text-align:start}
.grp-h:hover{background:var(--surface-2)}
.grp-h .gt{flex:1}
.grp-h .gc{font-size:12px;font-weight:500;color:var(--muted);background:var(--surface-2);padding:0 8px;border-radius:99px;direction:ltr}
.grp-h .chev{font-size:12px;color:var(--muted);transition:transform .2s}
.grp:not(.open) .chev{transform:rotate(90deg)}
.grp:not(.open) .grp-l{display:none}
.grp-l,.subs{list-style:none;margin:0;padding:0}
.lk{display:flex;align-items:center;gap:10px;padding:6px 10px;margin:1px 0;border-radius:8px;color:var(--text);text-decoration:none;font-size:15px;line-height:1.45}
.lk:hover{background:var(--surface-2)}
.lk .chk{flex:none;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;font-size:10px;color:transparent}
.lk.done .chk{background:var(--accent);border-color:var(--accent);color:#fff}
.lk .lt{display:flex;flex-direction:column;min-width:0}
.lk .en{font-size:11.5px;color:var(--faint);direction:ltr;text-align:end;unicode-bidi:isolate}
.lk.active{background:var(--accent);color:var(--accent-ink);font-weight:600}
.lk.active .en{color:rgba(255,255,255,.8)}
.lk.active .chk{border-color:#fff}
.lk.active.done .chk{background:#fff;color:var(--accent)}
.subs{margin:2px 0 8px;padding-inline-start:28px;border-inline-start:2px solid var(--accent-soft);margin-inline-start:18px}
.subs button{display:block;width:100%;text-align:start;border:0;background:none;color:var(--muted);font-size:13.5px;padding:4px 10px;border-radius:6px;line-height:1.5}
.subs button:hover{color:var(--accent-text);background:var(--surface-2)}
.nav-empty{color:var(--muted);font-size:14px;padding:16px;text-align:center}

/* ================= Lesson typography ================= */
.top-pn{display:flex;justify-content:space-between;gap:8px;margin-bottom:18px}
.crumbs{font-size:13.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumbs .sep{color:var(--faint)}
h1{font-size:34px;line-height:1.35;margin:6px 0 2px;font-weight:700}
.en-title{direction:ltr;text-align:end;color:var(--faint);font-size:14px;margin-bottom:18px;font-family:"JetBrains Mono",monospace}
#lesson h2{font-size:23px;line-height:1.45;margin:38px 0 10px;font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--border)}
#lesson p{margin:12px 0}
#lesson ul,#lesson ol{margin:10px 0;padding-inline-start:26px}
#lesson li{margin:5px 0}
.pkg-note{display:flex;gap:10px;align-items:flex-start;background:var(--info-bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:15px;margin:10px 0 18px}
.pkg-note.ready{background:var(--ok-soft)}
.tbl{overflow-x:auto;margin:16px 0;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse;font-size:15px;line-height:1.6}
.tbl th{background:var(--surface-2);font-weight:600;text-align:start;padding:9px 12px;white-space:nowrap}
.tbl td{padding:8px 12px;border-top:1px solid var(--border);vertical-align:top}
.callout{border-inline-start:4px solid;border-radius:10px;padding:12px 16px;margin:18px 0;font-size:16px;line-height:1.85}
.callout .ct{font-weight:700;display:block;margin-bottom:2px}
.callout.tip{background:var(--tip-bg);border-color:var(--tip-bd)}
.callout.warn{background:var(--warn-bg);border-color:var(--warn-bd)}
.callout.info{background:var(--info-bg);border-color:var(--info-bd)}
.static{margin:14px 0;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.static .sh{background:var(--surface-2);font-size:13px;color:var(--muted);padding:6px 14px}
.static pre{margin:0;padding:12px 16px;direction:ltr;text-align:left;background:var(--con-bg);color:var(--con-text);font-size:14px;line-height:1.7;overflow-x:auto}

/* ================= Example cards + editor ================= */
.example,.challenge,.notes,#lesson h2{scroll-margin-top:calc(var(--hdr-h) + var(--sat) + 16px)}
.example{margin:22px 0;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.ex-h{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface-2);font-weight:600;font-size:16px;line-height:1.5}
.ex-tag{flex:none;background:var(--accent);color:var(--accent-ink);font-size:12.5px;padding:1px 10px;border-radius:99px;font-weight:600}
.ex-note{padding:12px 16px;font-size:15.5px;line-height:1.85;border-top:1px solid var(--border);background:var(--surface)}
.runner{display:block}
.ed-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 6px 12px;border-bottom:1px solid var(--border);background:var(--code-bg)}
.ed-lang{direction:ltr;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--faint)}
.ed-actions{display:flex;gap:6px}
.mini{border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:13px;border-radius:7px;padding:3px 10px;line-height:1.6}
.mini:hover{color:var(--text);background:var(--surface-2)}
.ed{direction:ltr;text-align:left;background:var(--code-bg)}
.ed textarea.fallback{width:100%;min-height:140px;border:0;resize:vertical;padding:12px;background:var(--code-bg);color:var(--text);font:14.5px/1.65 "JetBrains Mono",monospace;direction:ltr;tab-size:4}
.run-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--border);background:var(--surface)}
.run-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 24px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:16.5px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.12);transition:background .15s,transform .05s}
.run-btn:hover{background:var(--accent-hover)}
.run-btn:active{transform:translateY(1px)}
.run-btn[disabled]{opacity:.75;cursor:progress}
.run-btn .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.kbd-hint{font-size:12.5px;color:var(--faint)}
.CodeMirror{height:auto;font-family:"JetBrains Mono","IBM Plex Sans Arabic",ui-monospace,monospace;font-size:14.5px;line-height:1.65;background:var(--code-bg);color:var(--text)}
.CodeMirror-scroll{min-height:56px}
.CodeMirror-lines{padding:10px 0}
.CodeMirror pre.CodeMirror-line,.CodeMirror pre.CodeMirror-line-like{padding:0 12px}
.CodeMirror-gutters{background:var(--code-bg);border-right:1px solid var(--border)}
.CodeMirror-linenumber{color:var(--faint);padding:0 8px 0 10px}
.CodeMirror-cursor{border-left:2px solid var(--text)}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected,.CodeMirror-line::selection,.CodeMirror-line>span::selection,.CodeMirror-line>span>span::selection{background:rgba(4,170,109,.22)!important}
.cm-s-pyar .cm-keyword{color:var(--tok-kw);font-weight:500}
.cm-s-pyar .cm-string,.cm-s-pyar .cm-string-2{color:var(--tok-str)}
.cm-s-pyar .cm-number{color:var(--tok-num)}
.cm-s-pyar .cm-comment{color:var(--tok-com);font-style:italic}
.cm-s-pyar .cm-def{color:var(--tok-def)}
.cm-s-pyar .cm-builtin{color:var(--tok-builtin)}
.cm-s-pyar .cm-variable,.cm-s-pyar .cm-variable-2{color:var(--text)}
.cm-s-pyar .cm-operator{color:var(--tok-op)}
.cm-s-pyar .cm-property{color:var(--tok-prop)}
.cm-s-pyar .cm-meta{color:var(--tok-kw)}
.cm-s-pyar .cm-atom{color:var(--tok-num)}
.cm-s-pyar .CodeMirror-matchingbracket{color:var(--accent-text)!important;background:var(--accent-soft);outline:none}
.cm-err-line{background:var(--err-soft)!important}

/* ================= Console ================= */
.console{background:var(--con-bg);color:var(--con-text);border-top:1px solid var(--border)}
.con-h{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--con-head);font-size:13px;color:var(--con-muted)}
.con-h .mini{background:transparent;border-color:#2c3644;color:var(--con-muted)}
.con-h .mini:hover{color:#fff;background:#222b37}
.con-body{padding:4px 0 10px;max-height:460px;overflow:auto}
.con-out{margin:0;padding:10px 16px;direction:ltr;text-align:left;white-space:pre;font-size:14px;line-height:1.65;color:var(--con-text);tab-size:4}
.con-phase,.con-empty{padding:12px 16px;font-size:14.5px;color:var(--con-muted)}
.con-empty code{background:#222b37;color:#e4eaf1}
.con-err{margin:8px 12px;border-radius:9px;background:rgba(255,90,90,.1);border:1px solid rgba(255,110,110,.35);padding:10px 14px;font-size:15px;line-height:1.8;color:#ffd6d6}
.con-err .et{font-weight:700;color:#ff8f8f}
.con-err .et bdi{font-family:"JetBrains Mono",monospace}
.err-src{direction:ltr;text-align:left;font-family:"JetBrains Mono","IBM Plex Sans Arabic",monospace;font-size:13.5px;background:rgba(0,0,0,.35);border-radius:6px;padding:6px 10px;margin:6px 0;color:#fff;white-space:pre;overflow-x:auto}
.err-src .ln{color:#ff8f8f;margin-right:10px}
.err-ar{color:#f3e6e6}
.err-tb{direction:ltr;text-align:left;font-family:"JetBrains Mono",monospace;font-size:12.5px;color:#c99;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.verdict{margin:10px 12px 4px;border-radius:9px;padding:10px 14px;font-size:15.5px;line-height:1.8;font-weight:500}
.verdict.ok{background:rgba(4,170,109,.18);border:1px solid rgba(47,208,142,.5);color:#bff5dc}
.verdict.bad{background:rgba(255,180,60,.12);border:1px solid rgba(255,190,80,.45);color:#ffe3b0}

/* ================= Challenge / notes / footer ================= */
.challenge{margin:44px 0 22px;border:2px solid var(--accent);border-radius:16px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.ch-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;background:var(--accent-soft)}
.ch-badge{font-weight:700;font-size:18px;color:var(--accent-text)}
.ch-done{font-size:13px;font-weight:600;background:var(--accent);color:#fff;border-radius:99px;padding:2px 12px}
.ch-task{padding:14px 18px 6px;font-size:16.5px}
.ch-tools{display:flex;gap:8px;flex-wrap:wrap;padding:6px 18px 12px}
.ch-hint,.ch-sol{margin:0 18px 14px;border-radius:10px;padding:10px 14px;font-size:15px}
.ch-hint{background:var(--tip-bg)}
.ch-sol{background:var(--surface-2)}
.ch-sol pre{direction:ltr;text-align:left;margin:6px 0;padding:10px 12px;border-radius:8px;background:var(--con-bg);color:var(--con-text);font-size:13.5px;overflow-x:auto}
.ch-body{border-top:1px solid var(--border)}
.notes{margin:30px 0}
.notes textarea{width:100%;min-height:120px;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;line-height:1.8;background:var(--surface);color:var(--text);resize:vertical}
.notes textarea:focus{outline:none;border-color:var(--accent)}
.notes .muted{color:var(--muted);font-size:14.5px;margin:4px 0 10px!important}

.pq-next{display:flex;justify-content:center;margin:26px 0 10px}

<script>
/* =====================================================================
   بيانات الدروس
   C`...` : قالب نصي خام (يحافظ على \n و \d داخل أكواد بايثون) مع إزالة الإزاحة
   L(section, id, title, english, blocks, challenge, packages)
   ===================================================================== */
const C = (s, ...v) => {
  const t = String.raw(s, ...v).replace(/^\n/, '').replace(/\s+$/, '');
  const lines = t.split('\n');
  const ind = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
  return isFinite(ind) ? lines.map(l => l.slice(ind)).join('\n') : t;
};
const LESSONS = [];
function L(sec, id, title, en, blocks, ch, pkgs) { LESSONS.push({ sec, id, title, en, blocks, ch, pkgs: pkgs || null }); }

/* =========================== أساسيات بايثون (1) =========================== */

L('py', 'get-started', 'البداية مع بايثون', 'Python Get Started', [
  `مرحبًا بك! 👋 إذا كانت هذه <b>أول مرة</b> تكتب فيها كودًا في حياتك، فأنت في المكان الصحيح تمامًا. لن تحتاج إلى تثبيت أي برنامج — كل الأكواد هنا تعمل مباشرةً داخل متصفحك.`,
  { h: 'ما هي بايثون؟' },

public class Main {
    public static void main(String[] args) {
        int[] grades = {85, 92, 78, 95, 88};
        int max = grades[0];
        int sum = 0;

        for (int g : grades) {
            sum += g;
            if (g > max) {
                max = g;
            }
        }

        System.out.println("أعلى درجة: " + max);
        System.out.println("المتوسط: " + (double) sum / grades.length);
    }
}

  }
});

}

class Square extends Shape {
    double s;
    Square(double s) { this.s = s; }
    @Override

}

    @Override

        for (Shape sh : shapes) total += sh.area();
        System.out.println(Math.round(total * 100) / 100.0);
    }
}

    $('#progText').textContent = n + '/' + LESSONS.length;
    $('#progBar').style.width = (n / LESSONS.length * 100) + '%';
  }

  /* ---------------- القائمة الجانبية ---------------- */
  let current = null;
  const nav = $('#nav'), search = $('#search');
  let navPick = null;
  $('#langSwitch').addEventListener('click', e => {
    const b = e.target.closest('[data-lang]'); if (!b) return;
    navPick = b.dataset.lang; renderNav(); nav.scrollTop = 0;
  });
  function renderNav() {
    const q = normAr(search.value.trim());
    const navLang = navPick || (current && current.lang) || state.lang || 'py';
    $('#langSwitch').innerHTML = LANGS.map(lg => '<button type="button" role="tab" aria-selected="' + (lg.id === navLang) + '" data-lang="' + lg.id + '" class="' + (lg.id === navLang ? 'on' : '') + '">' + lg.icon + ' ' + lg.name + '</button>').join('');
    const pst = practiceStats(navLang);
    let html = q ? '' : '<a class="nav-practice" href="#practice-' + navLang + '">🏋️ التمارين والتحديات <small>' + pst.solved + '/' + pst.total + '</small></a>';
    for (const sec of SECTIONS.filter(x => x.lang === navLang)) {
      const all = LESSONS.filter(l => l.sec === sec.id);
      const shown = q ? all.filter(l => normAr(l.title + ' ' + l.en).includes(q)) : all;
      if (q && !shown.length) continue;
      const doneN = all.filter(l => state.done[l.id]).length;
      const open = q ? true : (state.open[sec.id] != null ? state.open[sec.id] : true);
      html += '<div class="grp' + (open ? ' open' : '') + '"><button type="button" class="grp-h" data-sec="' + sec.id + '" aria-expanded="' + open + '">' +
        '<span class="gi">' + sec.icon + '</span><span class="gt">' + sec.title + '</span><span class="gc">' + doneN + '/' + all.length + '</span><span class="chev">▾</span></button><ul class="grp-l">';
      for (const l of shown) {
        const active = current && l.id === current.id;
        html += '<li><a href="#' + l.id + '" class="lk' + (active ? ' active' : '') + (state.done[l.id] ? ' done' : '') + '"' + (active ? ' aria-current="page"' : '') + '>' +
          '<span class="chk">✓</span><span class="lt"><span class="t">' + l.title + '</span><span class="en">' + l.en + '</span></span></a>';
        if (active && !q) {
          html += '<ul class="subs">' + l.exTitles.map((t, i) => '<li><button type="button" data-jump="ex-' + i + '">' + t + '</button></li>').join('') +
            '<li><button type="button" data-jump="challenge">🏆 التحدي البرمجي</button></li><li><button type="button" data-jump="notes">📝 ملاحظاتي</button></li></ul>';
        }
        html += '</li>';
      }
      html += '</ul></div>';
    }
    if (q && !/class="grp/.test(html)) html += '<div class="nav-empty">لا توجد دروس مطابقة 🔍</div>';
    nav.onclick = null;
    nav.innerHTML = html;
  }
  nav.addEventListener('click', e => {
    const g = e.target.closest('.grp-h');
    if (g) { const id = g.dataset.sec; const isOpen = g.parentElement.classList.contains('open'); state.open[id] = !isOpen; save(); renderNav(); return; }
    const j = e.target.closest('[data-jump]');
    if (j) { const t = document.getElementById(j.dataset.jump); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); closeDrawer(); return; }
    if (e.target.closest('a.lk')) closeDrawer();
  });
  search.addEventListener('input', renderNav);
  search.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const a = $('a.lk', nav); if (a) { location.hash = a.getAttribute('href'); search.value = ''; renderNav(); closeDrawer(); } }
    if (e.key === 'Escape') { search.value = ''; renderNav(); }
  });

  function openDrawer() { document.body.classList.add('nav-open'); setTimeout(updateBnav); $('#menuBtn').setAttribute('aria-expanded', 'true'); const a = $('.lk.active', nav); if (a) a.scrollIntoView({ block: 'center' }); }
  function closeDrawer() { document.body.classList.remove('nav-open'); setTimeout(updateBnav); $('#menuBtn').setAttribute('aria-expanded', 'false'); }
  $('#menuBtn').addEventListener('click', () => document.body.classList.contains('nav-open') ? closeDrawer() : openDrawer());
  $('#overlay').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

  $('#resetAll').addEventListener('click', () => {
    if (!confirm('سيتم حذف تقدّمك وملاحظاتك وكل تعديلاتك على الأكواد. هل أنت متأكد؟')) return;
    state.done = {}; state.notes = {}; state.code = {}; state.practice = {}; saveNow();
    renderProgress(); renderLesson(current ? current.id : LESSONS[0].id); toast('تمت إعادة الضبط');
  });

  /* ---------------- عرض الدرس ---------------- */
  function renderBlock(b, L, counter) {
    if (typeof b === 'string') return el('p', null, b);
    if (b.h) return el('h2', null, b.h);
    if (b.ul || b.ol) { const t = el(b.ul ? 'ul' : 'ol'); (b.ul || b.ol).forEach(x => t.append(el('li', null, x))); return t; }
    if (b.table) {
      const w = el('div', 'tbl'); const [head, ...rows] = b.table;
      w.innerHTML = '<table><thead><tr>' + head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
      return w;
    }
    if (b.tip) return el('div', 'callout tip', '<span class="ct">💡 نصيحة</span>' + b.tip);
    if (b.warn) return el('div', 'callout warn', '<span class="ct">⚠️ انتبه</span>' + b.warn);
    if (b.info) return el('div', 'callout info', '<span class="ct">ℹ️ معلومة</span>' + b.info);
    if (b.shell != null || b.pre != null) {
      const w = el('div', 'static'); w.append(el('div', 'sh', b.title ? esc(b.title) : (b.shell != null ? '💻 الطرفية (Terminal) — على جهازك' : '')));
      const pre = el('pre'); pre.textContent = b.shell != null ? b.shell : b.pre; w.append(pre); return w;
    }
    if (b.ex) {
      const n = counter();
      const card = el('section', 'example'); card.id = 'ex-' + n;
      card.append(el('div', 'ex-h', '<span class="ex-tag">مثال ' + (n + 1) + '</span><span>' + b.ex + '</span>'));
      const r = el('div'); card.append(r);
      makeRunner(r, { key: L.id + '#' + n, initial: b.code, lang: L.lang });
      if (b.note) {
        if (APP) { const d = el('details', 'ex-more'); d.innerHTML = '<summary>💡 ماذا يحدث هنا؟</summary><div>' + b.note + '</div>'; card.append(d); }
        else card.append(el('div', 'ex-note', '👈 ' + b.note));
      }
      return card;
    }
    return document.createTextNode('');
  }

  function updateDoneBtn(b) {
    const d = !!state.done[current.id];
    b.classList.toggle('is-done', d);
    b.innerHTML = d ? '✅ أنهيت هذا الدرس (اضغط للتراجع)' : '☑️ علّم هذا الدرس كمكتمل';
  }

  function refreshPkgNote() {
    const n = $('.pkg-note'); if (!n || !current || !current.pkgs) return;
    const ready = current.pkgs.every(p => loaded.has(p));
    const names = current.pkgs.map(p => PKG_LABEL[p]).join(' و ');
    n.classList.toggle('ready', ready);
    if (APP) { n.classList.toggle('ready', true); n.innerHTML = '<span>📦</span><span>يستخدم مكتبة <b>' + names + '</b></span>'; return; }
    n.innerHTML = ready ? '<span>✅</span><span>مكتبة ' + names + ' محمّلة وجاهزة للاستخدام.</span>'
      : '<span>📦</span><span>هذا الدرس يستخدم مكتبة <b>' + names + '</b>. نحمّلها تلقائيًا في الخلفية (مرة واحدة فقط، قد يستغرق ذلك بضع ثوانٍ).</span>';
  }

  function pnLink(l, cls, arrowLabel) {
    if (!l) return '<span class="pn-btn ' + cls + ' ghost"></span>';
    return '<a class="pn-btn ' + cls + '" href="#' + l.id + '">' + arrowLabel + '<small>' + l.title + '</small></a>';
  }

  function renderLesson(id) {
    const L = byId[id] || LESSONS[0];
    current = L; state.last = L.id; state.lang = L.lang; state.lastBy[L.lang] = L.id; save();
    setLangColors(L.lang);
    const sec = SECTIONS.find(s => s.id === L.sec);
    const inSec = LESSONS.filter(l => l.sec === L.sec);
    const same = lessonsOf(L.lang), pos = same.indexOf(L);
    const prev = same[pos - 1], next = same[pos + 1];
    const art = $('#lesson'); art.innerHTML = ''; liveRunners = [];

    if (APP) art.insertAdjacentHTML('beforeend',
      '<span class="a-chip">' + sec.icon + ' ' + sec.title + ' · <bdi>' + (inSec.indexOf(L) + 1) + '/' + inSec.length + '</bdi></span>' +
      '<h1>' + L.title + '</h1>');
    else art.insertAdjacentHTML('beforeend',
      '<div class="top-pn">' + (prev ? '<a class="pn-btn" href="#' + prev.id + '">→ السابق</a>' : '<span></span>') +
      (next ? '<a class="pn-btn next" href="#' + next.id + '">التالي ←</a>' : '<span></span>') + '</div>' +
      '<div class="crumbs"><a href="#lang-' + L.lang + '">🏠 الرئيسية</a><span class="sep">‹</span><span>' + sec.icon + ' ' + sec.title + '</span><span class="sep">‹</span><span>الدرس ' + (inSec.indexOf(L) + 1) + ' من ' + inSec.length + '</span></div>' +
      '<h1>' + L.title + '</h1><div class="en-title">' + L.en + '</div>');
    if (L.pkgs) { art.append(el('div', 'pkg-note')); refreshPkgNote(); }

    let exN = 0; const counter = () => exN++;
    for (const b of L.blocks) art.append(renderBlock(b, L, counter));

    // التحدي البرمجي
    const ch = L.ch;
    const cs = el('section', 'challenge'); cs.id = 'challenge';
    cs.innerHTML =
      '<div class="ch-h"><span class="ch-badge">🏆 تحدي برمجي</span><span class="ch-done"' + (state.done[L.id] ? '' : ' hidden') + '>✓ مكتمل</span></div>' +
      '<div class="ch-task">' + ch.task + '</div>' +
      '<div class="ch-tools"><button type="button" class="mini" data-ch="hint">💡 تلميح</button><button type="button" class="mini" data-ch="sol">👀 إظهار الحل</button></div>' +
      '<div class="ch-hint" hidden>💡 ' + ch.hint + '</div>' +
      '<div class="ch-sol" hidden><b>الحل المقترح:</b><pre></pre><button type="button" class="mini" data-ch="use">انسخ الحل إلى المحرر</button></div>' +
      '<div class="ch-body"></div>';
    $('.ch-sol pre', cs).textContent = ch.solution || '';
    const chRunner = makeRunner($('.ch-body', cs), {
      key: L.id + '#ch', initial: ch.starter + '\n', check: ch.check, lang: L.lang, label: APP ? '✓  تحقّق من الحل' : 'تشغيل والتحقق ✓',
      onCheck(res, body) {
        const c = res.check || { ok: false, msg: 'تعذّر التحقق.' };
        const v = el('div', 'verdict ' + (c.ok ? 'ok' : 'bad'));
        v.textContent = c.ok ? '🎉 أحسنت! حللت التحدي بنجاح، وتم تعليم الدرس كمكتمل.' : '🤔 ليس بعد: ' + c.msg;
        body.append(v);
        if (c.ok) { if (!state.done[L.id]) toast('🎉 رائع! أكملت درس «' + L.title + '»'); setDone(L.id, true); }
      },
    });
    cs.addEventListener('click', e => {
      const b = e.target.closest('[data-ch]'); if (!b) return;
      if (b.dataset.ch === 'hint') { const h = $('.ch-hint', cs); h.hidden = !h.hidden; }
      if (b.dataset.ch === 'sol') {
        const s = $('.ch-sol', cs);
        if (s.hidden && !confirm('هل تريد رؤية الحل؟ حاول بنفسك أولًا — المحاولة هي أفضل طريقة للتعلّم 💪')) return;
        s.hidden = !s.hidden;
      }
      if (b.dataset.ch === 'use') { chRunner.set(ch.solution + '\n'); toast('تم وضع الحل في المحرر — شغّله الآن'); }
    });
    art.append(cs);

    // الملاحظات
    const ns = el('section', 'notes'); ns.id = 'notes';
    ns.innerHTML = '<h2>📝 ملاحظاتي</h2><p class="muted">اكتب ما تعلمته بكلماتك — تُحفظ تلقائيًا في متصفحك.</p>' +
      '<textarea placeholder="مثال: علامة = تعني «خزّن» وليست «يساوي»…"></textarea><div class="saved-ind" aria-live="polite"></div>';
    const ta = $('textarea', ns), ind = $('.saved-ind', ns); let noteT;
    ta.value = state.notes[L.id] || '';
    ta.addEventListener('input', () => {
      if (ta.value.trim()) state.notes[L.id] = ta.value; else delete state.notes[L.id];
      save(); ind.textContent = '…'; clearTimeout(noteT); noteT = setTimeout(() => { ind.textContent = '✓ تم الحفظ'; }, 500);
    });
    art.append(ns);

    // التذييل
    const ft = el('div', 'lesson-foot');
    ft.innerHTML = '<button type="button" class="done-btn"></button><div class="pn">' +
      pnLink(prev, 'prev', '→ الدرس السابق') + pnLink(next, 'next', APP ? 'التالي ←' : 'الدرس التالي ←') + '</div>';
    const db = $('.done-btn', ft); updateDoneBtn(db);
    db.addEventListener('click', () => setDone(L.id, !state.done[L.id]));
    art.append(ft);

    liveRunners.forEach(r => r.refresh());
    requestAnimationFrame(() => liveRunners.forEach(r => r.refresh()));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => liveRunners.forEach(r => r.refresh()));
    document.title = L.title + ' | OmniCode';
    window.scrollTo(0, 0);
    renderNav();
    const a = $('.lk.active', nav); if (a && !document.body.classList.contains('nav-open')) a.scrollIntoView({ block: 'nearest' });

    if (L.lang === 'java') setTimeout(() => javaStart().catch(() => { }), 400);
    else if (L.lang === 'cpp') setTimeout(() => cppStart().catch(() => { }), 400);
    else setTimeout(() => { pyStart().then(() => L.pkgs && ensurePkgs(L.pkgs)).catch(() => { }); }, 200);
  }

  function renderPicker() {
    setLangColors('home');
    const cards = LANGS.map(lg => {
      const ls = lessonsOf(lg.id);
      const d = ls.filter(l => state.done[l.id]).length;
      return '<a class="lang-card ' + lg.id + '" href="#lang-' + lg.id + '">' +
        '<span class="lc-top"><span class="lc-ic">' + lg.icon + '</span><span class="lc-name"><b>' + lg.name + '</b><small>' + lg.en + '</small></span></span>' +
        '<span class="lc-d">' + lg.desc + '</span>' +
        '<span class="lc-meta"><span>📚 ' + ls.length + ' درسًا</span><span class="lc-bar"><i style="width:' + (d / ls.length * 100) + '%"></i></span><span dir="ltr">' + d + '/' + ls.length + '</span></span>' +
        '<span class="lc-go">' + (d ? 'تابع التعلّم ←' : 'ابدأ ←') + '</span></a>';
    }).join('');
    $('#lesson').innerHTML =
      '<section class="ahome">' +
      '<div class="a-hello"><p class="a-sub">أهلاً بك في 👋</p><h1><span class="o-title">Omni<b>Code</b></span></h1>' +
      '<p class="a-desc">تعلّم البرمجة بالعربي من الصفر — اختر لغتك وابدأ.</p></div>' +
      '<div class="langs">' + cards + '</div>' +
      (IS_NATIVE ? '' : '<div class="pwa-box" id="pwaBox"></div>') +
      '</section>';
    if (!IS_NATIVE) renderPwaBox(null);
  }

  function renderAppHome(lang) {
    lang = lang || 'py';
    setLangColors(lang);
    const LG = LANGS.find(x => x.id === lang);
    const mine = lessonsOf(lang);
    const last = state.lastBy[lang] && byId[state.lastBy[lang]];
    const doneAll = mine.filter(l => state.done[l.id]).length;
    const pct = Math.round(doneAll / mine.length * 100);
    const C = 2 * Math.PI * 32;
    const cont = last || mine[0];
    const tracks = SECTIONS.filter(sec => sec.lang === lang).map(sec => {
      const ls = LESSONS.filter(l => l.sec === sec.id);
      const d = ls.filter(l => state.done[l.id]).length;
      const target = ls.find(l => !state.done[l.id]) || ls[0];
      return '<a class="a-track ' + sec.id + '" href="#' + target.id + '"><span class="ic">' + sec.icon + '</span>' +
        '<span class="t"><b>' + sec.title + '</b><small>' + ls.length + ' درسًا</small><span class="bar"><i style="width:' + (d / ls.length * 100) + '%"></i></span></span>' +
        '<span class="n">' + d + '/' + ls.length + '</span></a>';
    }).join('');
    const tracksCount = SECTIONS.filter(sec => sec.lang === lang).length;
    $('#lesson').innerHTML =
      '<section class="ahome">' +
      '<a class="a-back" href="#home">→ كل اللغات</a>' +
      '<div class="a-hello"><p class="a-sub">' + LG.icon + ' <bdi dir="ltr">' + LG.en + '</bdi></p><h1>تعلّم ' + LG.name + '</h1>' +
      '<p class="a-desc">' + LG.desc + '</p></div>' +
      '<div class="a-prog"><div class="a-ring"><svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="32" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="8"/>' +
      '<circle cx="38" cy="38" r="32" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - pct / 100)).toFixed(1) + '"/></svg><b>' + pct + '%</b></div>' +
      '<div class="t"><b>' + (doneAll ? 'أكملت ' + doneAll + ' من ' + mine.length : 'ابدأ رحلتك') + '</b><span>' + (doneAll ? 'استمر، أنت تتقدّم 🚀' : mine.length + ' درسًا مع تحديات تفاعلية') + '</span></div></div>' +
      '<a class="a-continue" href="#' + cont.id + '"><span class="ic">' + '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/></svg>' + '</span>' +
      '<span class="t"><small>' + (last ? 'تابع من حيث توقفت' : 'ابدأ من هنا') + '</small><b>' + cont.title + '</b></span><span class="go">‹</span></a>' +
      '<h2 class="a-h">' + (tracksCount > 1 ? 'الأقسام' : 'القسم') + '</h2><div class="a-tracks' + (tracksCount === 1 ? ' one' : '') + '">' + tracks + '</div>' +
      practiceCard(lang) +
      (IS_NATIVE ? '' : '<div class="pwa-box" id="pwaBox"></div>') +
      '</section>';
    if (!IS_NATIVE) renderPwaBox(lang);
  }

  function updateBnav() {
    const mode = document.body.classList.contains('nav-open') ? 'lessons' : (/^#practice-/.test(location.hash) ? 'practice' : (document.body.classList.contains('is-home') ? 'home' : 'learn'));
    document.querySelectorAll('.bnav [data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === mode));
  }
  document.querySelector('.bnav').addEventListener('click', e => {
    const b = e.target.closest('[data-nav]'); if (!b) return;
    const go = b.dataset.nav;
    if (go === 'lessons') { if (document.body.classList.contains('nav-open')) closeDrawer(); else openDrawer(); return; }
    closeDrawer();
    if (go === 'home') { if (location.hash !== '#home') location.hash = '#home'; else window.scrollTo({ top: 0, behavior: 'smooth' }); }
    if (go === 'practice') { const lg = (current && current.lang) || state.lang || 'py'; const h = '#practice-' + lg; if (location.hash !== h) location.hash = h; else window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (go === 'learn') { const lg = state.lang || 'py'; const t = (current && current.id) || state.lastBy[lg] || state.last || lessonsOf(lg)[0].id; if (location.hash !== '#' + t) location.hash = '#' + t; else window.scrollTo({ top: 0, behavior: 'smooth' }); }
  });
  $('#sheetClose').addEventListener('click', () => closeDrawer());
  // إخفاء الشريط السفلي أثناء الكتابة (لوحة المفاتيح مفتوحة) ليبقى مكان أكبر للكود
  if (APP) {
    const isField = t => t && t.closest && t.closest('.CodeMirror, textarea, input');
    document.addEventListener('focusin', e => { if (isField(e.target)) document.body.classList.add('typing'); });
    document.addEventListener('focusout', () => setTimeout(() => { if (!isField(document.activeElement)) document.body.classList.remove('typing'); }, 120));
  }

  let homeLang = null;
  function renderHome(lang) {
    homeLang = lang || null;
    if (homeLang) state.lang = homeLang;
    current = null; liveRunners = [];
    document.body.classList.add('is-home'); closeDrawer();
    if (APP) {
      if (homeLang) renderAppHome(homeLang); else renderPicker();
      document.title = homeLang ? 'تعلّم ' + LANGS.find(x => x.id === homeLang).name + ' | OmniCode' : 'OmniCode — تعلّم البرمجة بالعربي';
      window.scrollTo(0, 0); renderNav(); updateBnav();
      return;
    }
    const last = state.last && byId[state.last];
    const doneAll = LESSONS.filter(l => state.done[l.id]).length;
    const cards = SECTIONS.map((sec, i) => {
      const ls = LESSONS.filter(l => l.sec === sec.id);
      const d = ls.filter(l => state.done[l.id]).length;
      const target = ls.find(l => !state.done[l.id]) || ls[0];
      const cta = d === 0 ? 'ابدأ القسم ←' : (d === ls.length ? 'راجع القسم 🎉' : 'تابع التعلّم ←');
      return '<a class="track ' + sec.id + '" href="#' + target.id + '">' +
        '<span class="t-step">' + (i + 1) + ' · ' + sec.level + '</span>' +
        '<div class="t-icon">' + sec.icon + '</div>' +
        '<h3>' + sec.title + '</h3><p class="t-desc">' + sec.desc + '</p>' +

  /* ---------- تطبيق الويب (iPhone / PWA) ---------- */
  const IS_NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  const IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const IS_STANDALONE = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  const CAN_OFFLINE = !IS_NATIVE && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost');
  if (CAN_OFFLINE) navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));

  if (state.offlineReady && !state.offline.py) { state.offline.py = true; }
  function renderPwaBox(lang) {
    const box = $('#pwaBox'); if (!box) return;
    let h = '';
    if (IS_IOS && !IS_STANDALONE && !IS_NATIVE) {
      h += '<div class="pwa-card"><span class="pi">📲</span><div><b>ثبّته كتطبيق على iPhone</b>' +
        'في Safari اضغط زر المشاركة <span class="share">⬆️</span> ثم اختر <b style="display:inline">«إضافة إلى الشاشة الرئيسية»</b>.</div></div>';
    }
    if (CAN_OFFLINE && lang) {
      const ready = !!state.offline[lang];
      const what = lang === 'java' ? 'محرك جافا (حوالي 7 ميجابايت)' : lang === 'cpp' ? 'محرك سي++ (حوالي 20 ميجابايت)' : 'بايثون و NumPy و Pandas (حوالي 50 ميجابايت)';
      const whatDone = { java: 'محرك جافا', cpp: 'محرك سي++' }[lang] || 'بايثون و NumPy و Pandas';
      h += '<div class="pwa-card"><span class="pi">📥</span><div><b>استخدمه بدون إنترنت</b>' +
        '<span class="muted">' + (ready ? 'تم تنزيل ' + whatDone + ' على جهازك ✅' : 'نزّل ' + what + ' مرة واحدة ليعمل كل شيء بدون اتصال.') + '</span>' +
        (ready ? '' : '<br><button type="button" id="offlineBtn">تنزيل للاستخدام بدون إنترنت</button>') + '</div></div>';
    }
    box.innerHTML = h;
    // نتحقق من الذاكرة الفعلية: إذا حُذفت الملفات نُظهر زر التنزيل من جديد
    if (CAN_OFFLINE && lang && state.offline[lang] && window.caches && !box.dataset.checked) {
      box.dataset.checked = '1';
      const probe = lang === 'java' ? 'java/compiler.wasm' : lang === 'cpp' ? 'cpp/clang.wasm' : null;
      (probe ? caches.match(new URL(probe, location.href).href).then(r => !!r)
        : caches.open('pyar-pyodide-0.26.4').then(c => c.keys()).then(ks => ks.some(r => r.url.includes('/pandas-'))))
        .then(ok => { if (!ok) { state.offline[lang] = false; saveNow(); renderPwaBox(lang); } }).catch(() => { });
    }
    const b = $('#offlineBtn');
    if (b) b.addEventListener('click', async () => {
      b.disabled = true; b.textContent = '⏳ جارٍ التنزيل…';
      const fail = (msg, detail) => {
        b.disabled = false; b.textContent = 'إعادة المحاولة';
        let note = $('.pwa-err', box);
        if (!note) { note = el('div', 'pwa-err'); b.parentElement.append(note); }
        note.textContent = msg + (detail ? ' (' + detail + ')' : '');
        toast(msg);
      };
      // 1) نتأكد أن المتصفح يدعم تشغيل جافا (WebAssembly GC) قبل تنزيل أي شيء
      if (lang === 'java' && !javaSupported()) {
        fail('متصفحك لا يدعم تشغيل جافا. حدّث المتصفح (Chrome أو Edge 119+، Firefox 120+، Safari 18.2+).');
        return;
      }
      // 2) ننتظر الـ Service Worker (المسؤول عن الحفظ) — بحد أقصى 8 ثوانٍ بدل الانتظار للأبد
      const sw = await Promise.race([navigator.serviceWorker.ready.then(() => true), new Promise(r => setTimeout(() => r(false), 8000))]);
      if (!sw) { fail('تعذّر تفعيل خاصية الحفظ في هذا المتصفح. أعد تحميل الصفحة ثم حاول مرة أخرى.', 'service worker'); return; }
      try {
        if (lang === 'java' || lang === 'cpp') {
          const FILES = lang === 'java' ? JAVA_FILES : CPP_FILES, nm = lang === 'java' ? 'جافا' : 'سي++';
          // 3) ننزّل كل ملف على حدة، ونعرف بالضبط أيها فشل
          const failed = [];
          await Promise.all(FILES.map(async u => {
            try { const r = await fetch(u, { cache: 'no-cache' }); if (!r.ok) failed.push(u.split('/').pop() + ' ' + r.status); else await r.arrayBuffer(); }
            catch (e) { failed.push(u.split('/').pop()); }
          }));
          // ملف تلوين الكود ليس ضروريًا للتشغيل — فشله لا يوقف التنزيل
          fetch('https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js').catch(() => { });
          if (failed.length) { fail('تعذّر تنزيل بعض ملفات ' + nm + ' — تحقق من الإنترنت ثم أعد المحاولة.', failed.join('، ')); return; }
          // 4) نشغّل المحرك مرة للتأكد أنه يعمل على هذا الجهاز
          try { await (lang === 'java' ? javaStart() : cppStart()); }
          catch (e) { fail('تم تنزيل الملفات، لكن تعذّر تشغيل محرك ' + nm + ' في هذا المتصفح.', String((e && e.message) || e).slice(0, 80)); return; }
        } else {
          await ensurePkgs(['numpy', 'pandas']);
        }
        state.offline[lang] = true; saveNow();
        toast('✅ أصبح ' + ({ java: 'قسم جافا', cpp: 'قسم سي++' }[lang] || 'قسم بايثون') + ' جاهزًا للعمل بدون إنترنت');
        renderPwaBox(lang);
      } catch (e) {
        fail('تعذّر التنزيل — تحقق من الإنترنت ثم أعد المحاولة.', String((e && e.message) || e).slice(0, 80));
      }
    });
  }


  /* ---------------- التمارين والتحديات ---------------- */
  Object.keys(PRACTICE).forEach(lang => PRACTICE[lang].forEach((lv, li) => lv.items.forEach((it, ii) => { it.id = lang + '-' + (li + 1) + '-' + (ii + 1); it.lang = lang; })));
  function practiceStats(lang, level) {
    const lvs = level ? [PRACTICE[lang][level - 1]] : PRACTICE[lang];
    let total = 0, solved = 0;
    lvs.forEach(lv => lv.items.forEach(it => { total++; if (state.practice[it.id]) solved++; }));
    return { total, solved };
  }
  function practiceCard(lang) {
    const st = practiceStats(lang);
    return '<a class="a-practice" href="#practice-' + lang + '"><span class="ic">🏋️</span><span class="t"><b>التمارين والتحديات</b>' +
      '<small>' + PRACTICE[lang].length + ' مستويات · أسئلة سريعة و«اصطد الخطأ» · حللت ' + st.solved + ' من ' + st.total + '</small></span><span class="go">تدرّب ←</span></a>';
  }
  const DIFF = n => '●'.repeat(n) + '○'.repeat(Math.max(0, 6 - n));
  const TYPE_LABEL = { quiz: ['❓ سؤال سريع', 'quiz'], bug: ['🐞 اصطد الخطأ', 'bug'], code: ['✍️ اكتب الكود', 'code'] };

  function markPractice(it, card) {
    if (!state.practice[it.id]) { state.practice[it.id] = true; save(); toast('🎉 أحسنت! +1 تمرين'); }
    card.classList.add('solved');
    const d = $('.pq-done', card); if (d) d.hidden = false;
    renderNav();
  }

  function renderPracticeItem(it, n) {
    const card = el('section', 'pq' + (state.practice[it.id] ? ' solved' : '')); card.id = 'pq-' + n;
    const [label, cls] = TYPE_LABEL[it.t];
    card.innerHTML = '<div class="pq-h"><span class="pq-type ' + cls + '">' + label + ' · ' + n + '</span><span class="pq-done"' + (state.practice[it.id] ? '' : ' hidden') + '>✓ محلول</span></div>';
    if (it.t === 'quiz') {
      card.insertAdjacentHTML('beforeend', '<div class="pq-q">' + it.q + '</div>');
      if (it.code) { const pre = el('pre', 'pq-code'); pre.textContent = it.code; card.append(pre); }
      const opts = el('div', 'pq-opts'); const why = el('div', 'pq-why'); why.hidden = true;
      it.opts.forEach((o, i) => {
        const b = el('button'); b.type = 'button'; b.dataset.i = i;
        b.innerHTML = '<span class="k">' + '١٢٣٤٥'[i] + '</span><bdi dir="auto"></bdi>'; $('bdi', b).textContent = o;
        opts.append(b);
      });
      const showRight = () => {
        opts.querySelectorAll('button').forEach(b => { b.disabled = true; if (+b.dataset.i === it.a) b.classList.add('right'); });
        why.className = 'pq-why ok'; why.innerHTML = '✅ <b>صحيح!</b> ' + it.why; why.hidden = false;
      };
      opts.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b || b.disabled) return;
        if (+b.dataset.i === it.a) { showRight(); markPractice(it, card); }
        else {
          b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); b.disabled = true;
          why.className = 'pq-why bad'; why.innerHTML = '❌ ليست هذه — فكّر مرة أخرى وجرّب إجابة أخرى.'; why.hidden = false;
        }
      });
      card.append(opts, why);
      if (state.practice[it.id]) showRight();
      return card;
    }
    // bug / code: editor + automatic check
    card.insertAdjacentHTML('beforeend', '<div class="pq-q"><span class="pq-title">' + it.title + '</span>' + it.task + '</div>' +
      '<div class="pq-tools"><button type="button" class="mini" data-pq="hint">💡 تلميح</button><button type="button" class="mini" data-pq="sol">👀 إظهار الحل</button></div>' +
      '<div class="pq-hint" hidden>💡 ' + it.hint + '</div><div class="pq-sol" hidden><b>الحل المقترح:</b><pre></pre><button type="button" class="mini" data-pq="use">انسخ الحل إلى المحرر</button></div>');
    $('.pq-sol pre', card).textContent = it.solution || '';
    const host = el('div'); card.append(host);
    const runner = makeRunner(host, {
      key: 'P:' + it.id, initial: (it.t === 'bug' ? it.code : it.starter) + '\n', check: it.check, lang: it.lang,
      label: APP ? '✓  تحقّق' : 'تشغيل والتحقق ✓',
      onCheck(res, body) {
        const c = res.check || { ok: false, msg: 'تعذّر التحقق.' };
        const v = el('div', 'verdict ' + (c.ok ? 'ok' : 'bad'));
        v.textContent = c.ok ? (it.t === 'bug' ? '🎉 ممتاز! اصطدت الخطأ وأصلحته.' : '🎉 أحسنت! الحل صحيح.') : '🤔 ليس بعد: ' + c.msg;
        body.append(v);
        if (c.ok) markPractice(it, card);
      },
    });
    card.addEventListener('click', e => {
      const b = e.target.closest('[data-pq]'); if (!b) return;
      if (b.dataset.pq === 'hint') { const h = $('.pq-hint', card); h.hidden = !h.hidden; }
      if (b.dataset.pq === 'sol') { const so = $('.pq-sol', card); if (so.hidden && !confirm('هل تريد رؤية الحل؟ حاول بنفسك أولًا 💪')) return; so.hidden = !so.hidden; }
      if (b.dataset.pq === 'use') { runner.set(it.solution + '\n'); toast('تم وضع الحل في المحرر — شغّله الآن'); }
    });
    return card;
  }

  function renderPractice(lang, level) {
    current = null; liveRunners = []; navPick = null;
    state.lang = lang; save();
    setLangColors(lang);
    document.body.classList.add('is-home'); closeDrawer();
    const LG = LANGS.find(x => x.id === lang);
    const levels = PRACTICE[lang];
    const art = $('#lesson'); art.innerHTML = '';
    if (!level || !levels[level - 1]) {
      const st = practiceStats(lang);
      const pct = st.total ? Math.round(st.solved / st.total * 100) : 0;
      const C = 2 * Math.PI * 32;
      art.innerHTML = '<section class="ahome">' +
        '<a class="a-back" href="#lang-' + lang + '">→ تعلّم ' + LG.name + '</a>' +
        '<div class="a-hello"><p class="a-sub">🏋️ تدرّب</p><h1>تمارين ' + LG.name + '</h1>' +
        '<p class="a-desc">أسئلة سريعة، وتحديات «اصطد الخطأ» وأخرى تكتب فيها الكود بنفسك. تبدأ سهلة جدًا وتصعب تدريجيًا مع الدروس — كل مستوى مناسب بعد الدروس المكتوبة تحته.</p></div>' +
        '<div class="a-prog"><div class="a-ring"><svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="32" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="8"/>' +
        '<circle cx="38" cy="38" r="32" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - pct / 100)).toFixed(1) + '"/></svg><b>' + pct + '%</b></div>' +
        '<div class="t"><b>حللت ' + st.solved + ' من ' + st.total + '</b><span>' + (st.solved ? 'استمر — كل تمرين يثبّت معلومة 💪' : 'ابدأ بالمستوى الأول — إنه سهل جدًا!') + '</span></div></div>' +
        '<h2 class="a-h">المستويات</h2><div class="lv-list">' +
        levels.map((lv, i) => {
          const ls = practiceStats(lang, i + 1);
          return '<a class="lv' + (ls.solved === ls.total ? ' done' : '') + '" href="#practice-' + lang + '-' + (i + 1) + '"><span class="num">' + (ls.solved === ls.total ? '✓' : (i + 1)) + '</span>' +
            '<span class="t"><b>' + lv.icon + ' ' + lv.title + '</b><small>بعد دروس: ' + lv.after + '</small><span class="diff">' + DIFF(i + 1) + '</span></span>' +
            '<span class="n">' + ls.solved + '/' + ls.total + '</span></a>';
        }).join('') + '</div></section>';
      document.title = 'تمارين ' + LG.name + ' | OmniCode';
    } else {
      const lv = levels[level - 1];
      art.insertAdjacentHTML('beforeend', '<a class="a-back" href="#practice-' + lang + '">→ كل المستويات</a>' +
        '<div style="margin-top:12px"><span class="a-chip">🏋️ المستوى ' + level + ' من ' + levels.length + ' · <bdi>' + DIFF(level) + '</bdi></span></div>' +
        '<h1>' + lv.icon + ' ' + lv.title + '</h1>' +
        '<p class="a-desc">يغطي دروس: ' + lv.after + '. حل التمارين بالترتيب — كل واحد أصعب قليلًا من الذي قبله.</p>');
      lv.items.forEach((it, i) => art.append(renderPracticeItem(it, i + 1)));
      const nx = el('div', 'pq-next');
      nx.innerHTML = level < levels.length ? '<a href="#practice-' + lang + '-' + (level + 1) + '">المستوى التالي: ' + levels[level].title + ' ←</a>'
        : '<a href="#practice-' + lang + '">🏁 أنهيت كل المستويات — العودة للقائمة</a>';
      art.append(nx);
      liveRunners.forEach(r => r.refresh());
      requestAnimationFrame(() => liveRunners.forEach(r => r.refresh()));
      document.title = lv.title + ' — تمارين ' + LG.name + ' | OmniCode';
      if (lang === 'java') setTimeout(() => javaStart().catch(() => { }), 300);
      else if (lang === 'cpp') setTimeout(() => cppStart().catch(() => { }), 300);
      else setTimeout(() => pyStart().catch(() => { }), 300);
    }
    window.scrollTo(0, 0);
    renderNav(); updateBnav();
  }

  function route() {
    const id = decodeURIComponent(location.hash.slice(1));
    const pm = id.match(/^practice-(py|java|cpp)(?:-(\d+))?$/);
    if (pm) { renderPractice(pm[1], pm[2] ? +pm[2] : 0); return; }
    const lm = id.match(/^lang-(py|java|cpp)$/);
    if (lm) { renderHome(lm[1]); return; }
    if (!byId[id]) { renderHome(null); return; }
    if (current && current.id === id) return;
    document.body.classList.remove('is-home');
    navPick = null;
    renderLesson(id);
    updateBnav();
  }
  window.addEventListener('hashchange', route);

  const isNewer = (a, b) => { const x = verNum(a), y = verNum(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0; } return false; };

      '<div class="upd-notes"></div>' +
      '<div class="upd-act"><button type="button" class="go">⬇️ تحميل التحديث</button><button type="button" class="later">لاحقًا</button></div></div>';
    $('.upd-notes', back).textContent = (rel.notes || 'تحسينات وإصلاحات.').trim().slice(0, 1200);
    $('.upd-notes', back).dir = 'auto';

    $('.later', back).addEventListener('click', () => { state.updLater = { v: rel.version, until: Date.now() + 24 * 3600 * 1000 }; saveNow(); back.remove(); });
  }
  // تنزيل التحديث داخل التطبيق ثم فتح شاشة التثبيت مباشرة (بدون متصفح أو GitHub)
  async function installUpdate(rel, back) {
    const U = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AppUpdater;
    if (!U || !/\.apk$/i.test(rel.url)) {            // نسخ قديمة من التطبيق: نفتح الرابط في المتصفح
      window.location.href = rel.url; back.remove();
      toast('بعد اكتمال التنزيل افتح الملف واضغط «تحديث»');
      return;
    }
    const act = $('.upd-act', back), notes = $('.upd-notes', back);
    act.innerHTML = '<div class="upd-prog"><div class="upd-bar"><i></i></div><span class="upd-pct">جارٍ التنزيل… 0%</span></div>';
    const bar = $('.upd-bar i', back), pct = $('.upd-pct', back);
    let sub = null;
    try {
      sub = await U.addListener('progress', p => {
        const r = p.total > 0 ? p.loaded / p.total : 0;
        bar.style.width = Math.round(r * 100) + '%';
        pct.textContent = 'جارٍ التنزيل… ' + (p.total > 0 ? Math.round(r * 100) + '%' : (p.loaded / 1048576).toFixed(1) + ' ميجابايت');
      });
      await U.download({ url: rel.url });
    } catch (e) {
      if (sub) sub.remove();
      act.innerHTML = '<button type="button" class="go">🔄 إعادة المحاولة</button><button type="button" class="later">لاحقًا</button>';
      notes.textContent = 'تعذّر تنزيل التحديث — تحقق من اتصالك بالإنترنت ثم أعد المحاولة.';
      $('.go', back).addEventListener('click', () => installUpdate(rel, back));
      $('.later', back).addEventListener('click', () => back.remove());
      return;
    }
    if (sub) sub.remove();
    bar.style.width = '100%'; pct.textContent = '✅ اكتمل التنزيل';
    const openInstaller = async () => {
      const ok = (await U.canInstall()).value;
      if (ok) { await U.install(); back.remove(); return; }
      // أول مرة فقط: أندرويد يطلب السماح للتطبيق بتثبيت التحديثات
      notes.textContent = 'خطوة أخيرة (مرة واحدة فقط): اسمح لـ OmniCode بتثبيت التحديثات.\nاضغط «فتح الإعدادات»، فعّل «السماح من هذا المصدر»، ثم ارجع للتطبيق وسيبدأ التثبيت تلقائيًا.';
      act.innerHTML = '<button type="button" class="go">⚙️ فتح الإعدادات</button><button type="button" class="later">لاحقًا</button>';
      $('.later', back).addEventListener('click', () => back.remove());
      $('.go', back).addEventListener('click', async () => {
        await U.openInstallSettings();
        const CA = window.Capacitor.Plugins.App;
        const h = await CA.addListener('resume', async () => {
          h.remove();
          if ((await U.canInstall()).value) { await U.install(); back.remove(); }
        });
      });
    };
    await openInstaller();
  }

  async function checkForUpdate(opts) {
    opts = opts || {};
    const Cap = window.Capacitor;
    if (!opts.test && (!IS_NATIVE || !UPDATE_REPO || !navigator.onLine)) return null;
    let current = opts.current;
    if (!current) { try { current = (await Cap.Plugins.App.getInfo()).version; } catch (e) { return null; } }
    let rel;
    try {
      const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 8000);
      const r = await fetch(opts.api || ('https://api.github.com/repos/' + UPDATE_REPO + '/releases/latest'), { signal: ctl.signal, headers: { Accept: 'application/vnd.github+json' } });
      clearTimeout(tm);
      if (!r.ok) return null;
      const j = await r.json();
      const apk = (j.assets || []).find(a => /\.apk$/i.test(a.name));
      rel = { version: (j.tag_name || j.name || '').replace(/^v/i, ''), notes: j.body || '', url: apk ? apk.browser_download_url : j.html_url };
    } catch (e) { return null; }
    if (!rel.version || !isNewer(rel.version, current)) return { upToDate: true, current, latest: rel.version };
    const later = state.updLater;
    if (!opts.force && later && later.v === rel.version && Date.now() < later.until) return { postponed: true };
    showUpdate(rel, current);
    return { shown: true, current, latest: rel.version };
  }
  window.omniCheckUpdate = checkForUpdate;   // للاختبار اليدوي
  if (IS_NATIVE) {
    (async () => {
      try {
        const info = await window.Capacitor.Plugins.App.getInfo();
        const b = $('#appVer');
        b.textContent = 'v' + info.version; b.hidden = false;
        b.addEventListener('click', async () => {
          if (!navigator.onLine) { toast('أنت الآن على الإصدار ' + info.version + ' — اتصل بالإنترنت للبحث عن تحديث'); return; }
          toast('🔍 جارٍ البحث عن تحديث…');
          const r = await checkForUpdate({ force: true });
          if (r && r.upToDate) toast('✅ أنت على آخر إصدار (' + info.version + ')');
          else if (!r) toast('تعذّر البحث عن تحديث الآن — حاول لاحقًا');
        });
      } catch (e) { }
    })();
  }
  if (IS_NATIVE) setTimeout(() => checkForUpdate().catch(() => { }), 3500);

  // زر الرجوع في أندرويد (يعمل فقط داخل تطبيق Capacitor)
  const CapApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (CapApp && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
    CapApp.addListener('backButton', ({ canGoBack }) => {
      const ub = document.querySelector('.upd-back'); if (ub) { ub.remove(); return; }
      if (document.body.classList.contains('nav-open')) { closeDrawer(); return; }
      if (!document.body.classList.contains('is-home')) {
        if (canGoBack) history.back(); else location.hash = '#home';
        return;
      }
      if (/^#lang-/.test(location.hash)) { location.hash = '#home'; return; }
      CapApp.exitApp();
    });
  }

  renderProgress();
  route();
  renderStatus();
})();
</script>
